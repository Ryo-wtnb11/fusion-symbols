name: CI

on:
  push:
    branches: [main]
  pull_request:

# Obsolete PR revisions need no more runner time; main keeps its checks and badge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Retain dependency artifacts without PR uploads or branch-cache churn.
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --no-default-features
      - run: cargo clippy --all-targets --all-features

  # Parallel full suites shorten latency without narrowing all-features coverage.
  # Clippy and rustdoc stay independent so they do not lengthen this path.
  test_suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: all-features
            args: "--all-features"
          - name: base
            args: "--no-default-features"
    env:
      # Plain --release would disable correctness guards; coverage keeps its profile.
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test ${{ matrix.args }}

  # Keep the required check name; failed, cancelled or skipped suites must fail it.
  test:
    if: always()
    needs: test_suites
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.test_suites.result }}' = success

  # Non-blocking coverage measurement for the README badge. Line coverage is
  # auxiliary here — the golden/coherence guards are the primary correctness
  # gates — so this job never fails the pipeline. It publishes a shields.io
  # endpoint JSON to the `badges` branch, which the README badge reads via
  # raw.githubusercontent.com.
  coverage:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      # One instrumented test run; both report formats are re-emitted from it.
      # Excluded from the line count: the ignored manual cache-measurement collectors.
      - run: cargo llvm-cov --workspace --all-features --no-report
      - run: cargo llvm-cov report --ignore-filename-regex 'src/cache_(audit|budget_pressure|trim_pressure)\.rs' --summary-only --json --output-path coverage.json
      - run: cargo llvm-cov report --ignore-filename-regex 'src/cache_(audit|budget_pressure|trim_pressure)\.rs' --codecov --output-path codecov.json
      - uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          fail_ci_if_error: false
      - name: Publish badge JSON to badges branch
        run: |
          pct=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          msg=$(printf '%.1f%%' "$pct")
          color=$(awk -v p="$pct" 'BEGIN{print (p<60)?"red":(p<80)?"yellow":"brightgreen"}')
          jq -n --arg m "$msg" --arg c "$color" \
            '{schemaVersion:1,label:"coverage",message:$m,color:$c}' > badge.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Single-file branch built from plumbing; history is disposable, force-push.
          blob=$(git hash-object -w badge.json)
          tree=$(printf '100644 blob %s\tbadge.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "coverage badge: $msg ($GITHUB_SHA)")
          git push -f origin "$commit:refs/heads/badges"

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --all-features
        env:
          # Same KaTeX header as docs.rs (Cargo.toml [package.metadata.docs.rs]);
          # space-separated flags compose in the one RUSTDOCFLAGS env var.
          RUSTDOCFLAGS: -D warnings --html-in-header doc/katex-header.html
