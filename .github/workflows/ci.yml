name: CI

on:
  push:
    branches: [main]
  pull_request:

# Obsolete PR revisions need no more runner time; main keeps its checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Retain dependency artifacts without PR uploads or branch-cache churn.
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --no-default-features
      - run: cargo clippy --all-targets --all-features
      # Feature unification can re-enable these; `parking_lot` overrides the
      # sharded reader lock and `stats` adds shared hit-path writes.
      - name: quick_cache features exclude parking_lot and stats
        run: |
          cargo tree --all-features -e features -i quick_cache > quick_cache-features.txt
          ! grep -E 'feature "(parking_lot|stats)"' quick_cache-features.txt

  # Parallel full suites shorten latency without narrowing all-features coverage.
  # Clippy and rustdoc stay independent so they do not lengthen this path.
  test_suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: all-features
            args: "--all-features"
          - name: base
            args: "--no-default-features"
    env:
      # Plain --release would disable correctness guards; coverage keeps its profile.
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test ${{ matrix.args }}
      - if: matrix.name == 'default'
        run: cargo test ${{ matrix.args }} --lib lie::general::product_contract_tests::exceptional_product_cache_counted -- --ignored --exact --test-threads=1

  # Release-only category identities and regressions, selected by exact name
  # (never a blanket --ignored, which would also run timing reports).
  release_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Category identities through N >= 2 vertices (lib)
        run: >
          cargo test --release --all-features --lib --
          --ignored --exact
          lie::general::cgc::tests::g2_multiplicity_two_gates_through_frcore
          lie::general::cgc::tests::f4_26_unitarity_and_hexagon_through_frcore
          lie::general::cgc::tests::e6_27_unitarity_and_hexagon_through_frcore
      - name: Category identities and regressions (integration)
        run: >
          cargo test --release --all-features --test integration --
          --ignored --exact
          bcd_fr::d3_adjoint_om2_hexagon_closes
          bcd_fr::c2_35_multiplicity_three_f_unitarity_closes
          bcd_fr::sp4_81x81_every_channel
          lie_exceptional::g2::gates_through_a_multiplicity_two_vertex

  # Bitwise goldens and cross-process bytes on two architectures (x86_64 Linux,
  # arm64 macOS): values must not depend on the platform.
  bit_identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: bits-${{ matrix.os }}
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >
          cargo test --release --all-features --test integration --
          --include-ignored --skip print_golden --skip e8_n2_golden bit_identity:: gauge_golden::

  # Keep the required check name; failed, cancelled or skipped suites must fail it.
  test:
    if: always()
    needs: [test_suites, release_checks, bit_identity]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.test_suites.result }}' = success
      - run: test '${{ needs.release_checks.result }}' = success
      - run: test '${{ needs.bit_identity.result }}' = success

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --all-features
        env:
          # Same KaTeX header as docs.rs (Cargo.toml [package.metadata.docs.rs]);
          # space-separated flags compose in the one RUSTDOCFLAGS env var.
          RUSTDOCFLAGS: -D warnings --html-in-header doc/katex-header.html
