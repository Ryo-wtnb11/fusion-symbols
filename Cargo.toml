# `fusion-symbols` is the successor of the `racah` crate (published up to
# racah 0.2.4, which stays on crates.io): same modules and API under a name that
# covers every symmetry family this crate provides.
[package]
name = "fusion-symbols"
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fusion and recoupling symbols for symmetric tensors: exact SU(2) recoupling, and runtime Clebsch-Gordan / F- / R-coefficient generation for SU(N), SO(N), and Sp(2N) (successor of the racah crate)"
repository = "https://github.com/Ryo-wtnb11/fusion-symbols"
keywords = ["recoupling", "clebsch-gordan", "wigner", "lie-group", "6j"]
categories = ["mathematics", "science"]

# docs.rs builds the generated SU(N)/SO(N)/Sp(2N) surfaces too, not just the
# base SU(2) path, so the published docs cover the whole API.
# The KaTeX header renders `$...$` / `$$...$$` math in the doc comments; local
# and CI doc builds pass the same flag (README dev note; CI `doc` job).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "doc/katex-header.html"]

[features]
default = []
# Every supported (unitary, unitary-gauge, |1/F| dimensions) AnyonWiki entry of
# rank 5-7 in `table`: 303 entries beyond the 74 of rank <= 4 shipped by
# default. Data only, no dependency; about 4.2 MB of embedded tables.
anyonwiki-unitary = []
# Runtime coefficient generation for SU(N)/SO(N)/Sp(2N).
# Sequential dense factorization and contraction kernels; the caller owns parallelism.
cgc-gen = ["dep:t4a-faer"]

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
# R-symbols and twists of braided categories are complex (`table`). Default `std` feature kept: `Complex64::norm` and
# `from_polar` need it.
num-complex = "0.4"
# crates.io semver range; std only (no rayon or global parallelism).
# Only cgc-gen pulls the dense backend; base builds stay dependency-light.
t4a-faer = { version = "0.24.6", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"
# Benchmark harness (not a CI gate): small-spin, thousands-tier and cache-hit
# timings. Run with `cargo bench`.
criterion = "0.5"

[[bench]]
name = "wigner"
harness = false

# SU(N) CGC generation cost across (N, dim) pairs and the cache hit path.
[[bench]]
name = "sun_cgc"
harness = false
required-features = ["cgc-gen"]

# SU(N) F-symbol generation cost (cold contraction + warm F-cache hit).
[[bench]]
name = "sun_fr"
harness = false
required-features = ["cgc-gen"]

# SU(N) product working-set collector plus cold/warm decomposition timing.
[[bench]]
name = "sun_product"
harness = false
required-features = ["cgc-gen"]

# B/C/D F-symbol generation cost (cold catalog+sweep+contraction + warm hit).
[[bench]]
name = "bcd_fr"
harness = false
required-features = ["cgc-gen"]
