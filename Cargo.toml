# `fusion-symbols` is the successor of the `racah` crate (published up to
# racah 0.2.4, which stays on crates.io): same modules and API under a name that
# covers every symmetry family this crate provides.
[package]
name = "fusion-symbols"
version = "0.11.0"
edition = "2021"
rust-version = "1.100"
autotests = false
license = "MIT OR Apache-2.0"
description = "Fusion-category and representation data for symmetric tensors: exact SU(2) recoupling; runtime Clebsch-Gordan, F and R symbols for compact connected Lie groups (SU(N), U(N), Spin/SO(N), Sp(2N), tori, products, quotients); closed-form cyclic groups and fermion parity; tabulated anyon categories"
repository = "https://github.com/Ryo-wtnb11/fusion-symbols"
keywords = ["recoupling", "clebsch-gordan", "wigner", "lie-group", "6j"]
categories = ["mathematics", "science"]

# docs.rs builds the generated SU(N)/SO(N)/Sp(2N) surfaces too, not just the
# base SU(2) path, and include the optional table catalog. The generated
# Lie surface is enabled by default; published docs cover every feature.
# The KaTeX header renders `$...$` / `$$...$$` math in the doc comments; local
# and CI doc builds pass the same flag (README dev note; CI `doc` job).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "doc/katex-header.html"]

[features]
default = ["lie-generated"]
# Every supported (unitary, unitary-gauge, |1/F| dimensions) AnyonWiki entry of
# rank 5-7 in `table`: 303 entries beyond the 74 of rank <= 4 shipped by
# default. Data only, no dependency; about 4.2 MB of embedded tables.
anyonwiki-unitary = []
# Higher-rank simple Lie factors (A_r with r >= 2, B/C/D, G2-E8): a capability
# switch only. Every build compiles the same exact Cartan engine; A(1) needs
# no feature. Serial entries; `lie::prefill` runs on the caller's token.
lie-generated = []

[dependencies]
# Reclamation of the coefficient tiers' lock-free tables. The default
# `fast-barrier` feature (libc) makes the reader-side barrier a compiler fence
# on Linux and Windows.
seize = "0.5.1"
num-traits = "0.2"
# R-symbols and twists of braided categories are complex (`table`). Default `std` feature kept: `Complex64::norm` and
# `from_polar` need it.
num-complex = "0.4"

# One exact arithmetic family, including the public API.
malachite-nz = "0.14"
malachite-q = "0.14"
malachite-base = "0.14"
# Execution token of `lie::prefill`. No `parallel` feature: fs starts no
# scheduler; a consumer that enables it shares its pool through the token.
threadteam = { version = "0.6", default-features = false }

[dev-dependencies]
# Real teams for the prefill tests only.
threadteam = { version = "0.6", features = ["parallel"] }
rand = "0.10"
rand_chacha = "0.10"
# Benchmark harness (not a CI gate): small-spin, thousands-tier and cache-hit
# timings. Run with `cargo bench`.
criterion = "0.8"

[[bench]]
name = "torus"
harness = false

[[bench]]
name = "cache_concurrency"
harness = false

[[bench]]
name = "wigner"
harness = false

# SU(N) CGC generation cost across (N, dim) pairs and the cache hit path.
[[bench]]
name = "sun_cgc"
harness = false
required-features = ["lie-generated"]

# SU(N) F-symbol generation cost (cold contraction + warm F-cache hit).
[[bench]]
name = "sun_fr"
harness = false
required-features = ["lie-generated"]

# SU(N) product working-set collector plus cold/warm decomposition timing.
[[bench]]
name = "sun_product"
harness = false
required-features = ["lie-generated"]

# B/C/D F-symbol generation cost (cold modules+channels+contraction + warm hit).
[[bench]]
name = "bcd_fr"
harness = false
required-features = ["lie-generated"]

[[bench]]
name = "exceptional"
harness = false
required-features = ["lie-generated"]

# Warm public-entry hits of every category kind, label construction, and the
# label-tier hash distribution report (FS_WARM_MODE).
[[bench]]
name = "warm_hits"
harness = false
required-features = ["lie-generated"]

# Small prefill requests against the serial entry loop, including
# reduced budgets (FS_PREFILL_BUDGET=reduced) and team tokens.
[[bench]]
name = "prefill_small"
harness = false
required-features = ["lie-generated"]

# Cache timing, live-allocation and RSS reports (not tests).
[[example]]
name = "cache_pressure"
required-features = ["lie-generated"]

[profile.dev]
debug = "line-tables-only"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "allocations"
path = "tests/allocations.rs"

[[test]]
name = "base_cache_contract"
path = "tests/base_cache_contract.rs"

[[test]]
name = "cache_trim_base"
path = "tests/cache_trim_base.rs"

[[test]]
name = "cache_trim_generated_routing"
path = "tests/cache_trim_generated_routing.rs"

[[test]]
name = "coefficient_cache_budget_base"
path = "tests/coefficient_cache_budget_base.rs"

[[test]]
name = "coefficient_cache_budget_generated"
path = "tests/coefficient_cache_budget_generated.rs"

[[test]]
name = "coefficient_cache_budget_observation"
path = "tests/coefficient_cache_budget_observation.rs"

[[test]]
name = "doc_examples"
path = "tests/doc_examples.rs"

[[test]]
name = "generated_cache_contract"
path = "tests/generated_cache_contract.rs"

[[test]]
name = "lie_a1"
path = "tests/lie_a1.rs"

[[test]]
name = "lie_ar"
path = "tests/lie_ar.rs"

[[test]]
name = "lie_bcd"
path = "tests/lie_bcd.rs"

[[test]]
name = "sun_cgc_cache"
path = "tests/sun_cgc_cache.rs"

[[test]]
name = "sun_fr_cache"
path = "tests/sun_fr_cache.rs"

[[test]]
name = "sun_product_cache"
path = "tests/sun_product_cache.rs"
